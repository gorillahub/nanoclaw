name: State contract check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  state-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: State contract sanity
        run: node .ci/state-check.mjs
